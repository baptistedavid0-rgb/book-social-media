<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 pattes digitales — Logo animé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="logo-5pattes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0e14;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.wrap{width:min(100vw - 32px, 100vh - 90px);aspect-ratio:1;position:relative}
.stage{width:1080px;height:1080px;position:absolute;top:0;left:0;transform-origin:0 0;overflow:hidden;background:#f1f1ec;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;--t0:.25s}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(16,20,28,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,20,28,.035) 1px,transparent 1px);background-size:36px 36px}
body.render{background:#f1f1ec;display:block}
body.render .wrap{width:1080px;height:1080px}
body.render .controls{display:none}
.row{display:flex;align-items:center;gap:44px;position:relative}
.logo-hold{width:400px;animation:hold 1s cubic-bezier(.65,0,.35,1) 3.35s both}
@keyframes hold{from{transform:translateX(var(--shift)) scale(1.55)}to{transform:none}}
.lg-word{font-size:104px}
.tag{font-size:23px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#5a606c;position:relative;animation:tag .8s cubic-bezier(.16,1,.3,1) 4.8s both}
@keyframes tag{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.controls{display:flex;align-items:center;gap:12px;width:min(100vw - 32px, 100vh - 90px);color:#cfd3db;font:600 14px "Plus Jakarta Sans",sans-serif}
.controls button{background:#e4ef1d;color:#10141c;border:0;border-radius:99px;height:36px;padding:0 16px;font:inherit;cursor:pointer}
.controls input{flex:1;accent-color:#e4ef1d}
.controls output{min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="stage" id="stage">
  <div class="row">
    <div class="logo-hold" id="hold"></div>
    <div class="lg-word" id="word">
      <span class="mask"><span style="--d:4.05s">5 pattes</span></span>
      <span class="mask"><span style="--d:4.2s">digitales<i class="dots" style="--d2:4.7s"></i></span></span>
    </div>
  </div>
  <div class="tag">Stratégie digitale &amp; communication 360°</div>
</div></div>
<div class="controls"><button id="play">Pause</button><button id="restart">↺</button><input id="scrub" type="range" min="0" max="8" step="0.01" value="0"><output id="time">0.0 s</output></div>
<script src="logo-5pattes.js"></script>
<script src="logo-liquid.js"></script>
<script>
const hold = document.getElementById('hold');
hold.innerHTML = Logo5P.svg({id:'lgA', cls:'static'});
hold.style.setProperty('--t0', '2.2s');
Logo5PLiquid.mount(hold, {id:'liqA', T0:.25});
</script>
<script src="player.js" data-duration="8"></script>
</body>
</html>
